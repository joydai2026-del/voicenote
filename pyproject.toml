[project]
name = "voicenote-backend"
version = "0.1.0"
description = "VoiceNote backend — voice to publish-ready article"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.29",
    "anthropic>=0.25",
    "openai>=1.25",
    "python-multipart>=0.0.9",
    "modal>=0.64",
    "supabase>=2.3",
    "ruff>=0.4",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",          # for FastAPI TestClient
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # line length handled by formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
